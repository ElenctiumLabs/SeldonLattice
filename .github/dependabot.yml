version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"
      microsoft-entityframeworkcore:
        patterns:
          - "Microsoft.EntityFrameworkCore*"
      microsoft-aspnetcore:
        patterns:
          - "Microsoft.AspNetCore.*"
    labels:
      - dependencies
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    labels:
      - dependencies
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies

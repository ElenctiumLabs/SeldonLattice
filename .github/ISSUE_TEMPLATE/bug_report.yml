name: Bug report
description: Report a defect in Seldon Lattice
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What went wrong? What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: A minimal set of steps, including the question or input if relevant.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, .NET SDK version, Node version, browser.
      placeholder: Windows 11, .NET 10.0.x, Node 22, Chrome 131
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: Relevant API or browser console output. Redact any secrets.
      render: text
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that might help.

name: Feature request
description: Propose a new capability or improvement
title: "[Enhancement] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? What is the current behavior?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What do you want to happen? Describe the approach if you have one.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve the problem, or related work.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, screenshots, or references.

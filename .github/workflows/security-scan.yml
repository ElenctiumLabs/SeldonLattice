name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'

jobs:
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run Trivy SAST
        # Pinned to 0.35.0 — first safe release after the March 2026 supply-chain
        # compromise (GHSA-69fq-xp46-6x23). Do not use @master or any tag < 0.35.0.
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

  dependency-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore & Audit
        run: |
          dotnet restore SeldonLattice.slnx
          dotnet list package --vulnerable --include-transitive 2>/dev/null || true
